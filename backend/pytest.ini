[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    unit: unit tests
    integration: integration tests
    slow: slow tests
    live_llm: real-provider planner/action evaluation; opt in with GISMIND_LIVE_LLM=1
    legacy: legacy/compatibility coverage retained for historical production paths
