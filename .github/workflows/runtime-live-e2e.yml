name: Runtime live Chinese E2E

# Paid calls are explicit and separate from ordinary pull-request checks.
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: ['browser', 'prompt2000', 'robustness']
        default: 'browser'
        description: Real browser final-delivery gate, API prompt matrix, or robustness actions
      cases:
        type: choice
        options: ['20', '2000']
        default: '20'
        description: Chinese cases (20 is smoke coverage; 2000 is the full frozen corpus)
      reservation_usd:
        type: choice
        options: ['2', '10']
        default: '2'
        description: Conservative token reservation cap, not predicted invoice

permissions:
  contents: read

concurrency:
  group: runtime-live-e2e
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: live-llm
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-flash
      GISMIND_CASE_COUNT: ${{ inputs.cases }}
      GISMIND_LIVE_SUITE: ${{ inputs.suite }}
      GISMIND_RESERVATION_USD: ${{ inputs.reservation_usd }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-ci.txt
            backend/requirements-ci.lock
      - run: >-
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Check dependency consistency
        run: python -m pip check
      - uses: actions/setup-node@v5
        if: inputs.suite == 'browser'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install real browser prerequisites
        if: inputs.suite == 'browser'
        run: |
          python -m playwright install --with-deps chromium
          npm ci --prefix ../frontend
      - name: Validate browser inventory without spending quota
        if: inputs.suite == 'browser'
        run: python -m tests.browser.runtime_chinese_browser --inventory
      - name: Validate frozen corpus without spending quota
        run: python -m tests.live.prompt_e2e_2000 --inventory
      - name: Validate robustness corpus without spending quota
        run: python -m tests.live.runtime_robustness_smoke --inventory
      - name: Execute live API and semantic gates
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VITE_AMAP_KEY: ${{ secrets.AMAP_JS_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.AMAP_JS_SECURITY_CODE }}
        run: |
          if [ "$GISMIND_LIVE_SUITE" = "browser" ]; then
            python -m tests.browser.runtime_chinese_browser --live --limit "$GISMIND_CASE_COUNT" --concurrency 2 --input-usd-per-million 0.3 --output-usd-per-million 1.2 --cache-hit-usd-per-million 0.006 --max-cost-usd "$GISMIND_RESERVATION_USD" --budget-db .gismind/live-ci-budget.sqlite --output .gismind/live-ci
          elif [ "$GISMIND_LIVE_SUITE" = "robustness" ]; then
            python -m tests.live.runtime_robustness_smoke --live --input-usd-per-million 1.2 --output-usd-per-million 1.2 --max-cost-usd "$GISMIND_RESERVATION_USD" --output .gismind/live-ci
          else
            extra=()
            if [ "$GISMIND_CASE_COUNT" = "20" ]; then extra+=(--smoke-families); fi
            python -m tests.live.prompt_e2e_2000 --live --limit "$GISMIND_CASE_COUNT" "${extra[@]}" --concurrency 2 --qps 1 --usd-per-million 1.2 --max-cost-usd "$GISMIND_RESERVATION_USD" --output .gismind/live-ci
          fi
      - name: Preserve failures and resumable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-llm-evidence-${{ github.run_id }}
          path: |
            backend/.gismind/live-ci/
            backend/.gismind/live-ci-budget.sqlite*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
