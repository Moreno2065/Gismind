name: Runtime CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONHASHSEED: '0'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  MPLBACKEND: Agg
  GISMIND_LIVE_LLM: '0'
  LLM_API_KEY: ''
  LLM_BASE_URL: ''
  LLM_MODEL: deepseek-flash
  AMAP_KEY: ''
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-ci.txt
            backend/requirements-ci.lock
      - name: Install tested dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Legacy removal gate
        run: python -m app.runtime.gate --phase post-delete
      - name: Offline regression (no provider credentials)
        run: python -m pytest -p pytest_asyncio.plugin -p pytest_cov -m "not live_llm" --strict-markers --basetemp=.ci-tmp --junitxml=test-results/backend.xml --cov=app --cov-report=xml:test-results/coverage.xml
      - name: Require nonempty test evidence
        if: always()
        run: >-
          python -c "from pathlib import Path; paths = [Path('test-results/backend.xml'), Path('test-results/coverage.xml')]; missing = [str(p) for p in paths if not p.is_file() or not p.stat().st_size]; assert not missing, 'Missing or empty backend test evidence: ' + ', '.join(missing)"
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.os }}
          path: backend/test-results/
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test -- --reporter=default --reporter=junit --outputFile=test-results/frontend.xml
      - name: Require nonempty test evidence
        if: always()
        run: >-
          node -e "const fs = require('node:fs'); const p = 'test-results/frontend.xml'; if (!fs.existsSync(p) || fs.statSync(p).size === 0) throw new Error('Missing or empty frontend test evidence: ' + p)"
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve frontend test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: frontend/test-results/
          if-no-files-found: error
          retention-days: 14
